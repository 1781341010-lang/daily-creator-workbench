<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#1f4fff" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="创作台" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" href="apple-touch-icon.png" type="image/png" />
<meta name="format-detection" content="telephone=no" />
<title>每日创作台</title>
<style>
  :root{
    --primary:#1f4fff;          /* 宝石蓝 */
    --primary-deep:#1437c4;
    --primary-soft:#e9eeff;
    --accent:#7c5cff;
    --bg:#f3f5fb;
    --surface:#ffffff;
    --text:#14183a;
    --soft:#6b7090;
    --faint:#9aa0c0;
    --line:#eceef6;
    --up:#e8485f;              /* 涨/红 */
    --down:#13b67c;            /* 跌/绿 */
    --radius:18px;
    --radius-sm:13px;
    --shadow:0 8px 24px rgba(20,24,58,.08);
    --shadow-lg:0 14px 40px rgba(20,24,58,.16);
    --topbar-h:54px;
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;}
  input,textarea,button{font-family:inherit;font-size:15px;color:var(--text);}
  input:focus,textarea:focus{outline:none;}
  button{cursor:pointer;border:none;background:none;}
  [hidden]{display:none!important;}

  #app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);
    position:relative;padding-bottom:calc(20px + var(--safe-b));box-shadow:0 0 50px rgba(0,0,0,.05);}

  /* 顶栏 */
  .topbar{position:sticky;top:0;z-index:40;height:calc(var(--topbar-h) + 54px);
    background:rgba(243,245,251,.86);backdrop-filter:saturate(180%) blur(12px);
    -webkit-backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;padding:54px 12px 0;}
  .topbar button{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:var(--soft);font-size:20px;}
  .topbar button:active{background:var(--primary-soft);color:var(--primary);}
  .topbar-title{font-weight:800;font-size:16px;letter-spacing:.3px;}
  .topbar-title small{display:block;font-size:10px;font-weight:600;color:var(--faint);margin-top:-2px;}

  /* 抽屉 */
  .overlay{position:fixed;inset:0;background:rgba(10,12,30,.45);z-index:50;opacity:0;pointer-events:none;transition:opacity .25s;}
  .overlay.show{opacity:1;pointer-events:auto;}
  .drawer{position:fixed;top:0;left:0;height:100%;width:80%;max-width:320px;background:var(--surface);
    z-index:60;transform:translateX(-100%);transition:transform .26s cubic-bezier(.4,0,.2,1);
    display:flex;flex-direction:column;box-shadow:var(--shadow-lg);}
  .drawer.open{transform:none;}
  .drawer-head{padding:calc(26px + env(safe-area-inset-top,0px)) 20px 18px;
    background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;}
  .logo{display:flex;align-items:center;gap:10px;}
  .logo svg{width:34px;height:34px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.25));}
  .logo-name{font-size:19px;font-weight:900;letter-spacing:.5px;}
  .logo-sub{font-size:11px;opacity:.85;margin-top:2px;}
  .nav{padding:10px 10px;overflow-y:auto;flex:1;}
  .nav-item{display:flex;align-items:center;gap:13px;padding:13px 14px;border-radius:14px;color:var(--text);font-weight:600;font-size:15px;width:100%;text-align:left;}
  .nav-item .ico{width:30px;height:30px;border-radius:9px;background:var(--primary-soft);color:var(--primary);
    display:flex;align-items:center;justify-content:center;font-size:16px;flex:0 0 auto;}
  .nav-item .badge{margin-left:auto;font-size:11px;font-weight:700;color:#fff;background:var(--accent);padding:1px 8px;border-radius:999px;}
  .nav-item.active{background:var(--primary-soft);color:var(--primary);}
  .nav-item.active .ico{background:var(--primary);color:#fff;}
  .nav-item:active{transform:scale(.98);}
  .drawer-foot{padding:14px 20px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);font-size:11px;color:var(--faint);line-height:1.7;}
  .drawer-foot a{color:var(--primary);}

  /* 视图 */
  .view{padding:14px 14px 0;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .section-hint{color:var(--soft);font-size:12.5px;margin:2px 4px 12px;}
  .warn{background:#fff6e6;border:1px solid #ffd591;border-radius:12px;padding:10px 12px;font-size:12px;color:#9a6a00;line-height:1.6;margin:0 4px 12px;}
  .warn b{color:#7a4f00;}
  .warn.ok{background:#e9fbf3;border:1px solid #8fe3c4;color:#0c7a52;}
  .warn.ok b{color:#0a6244;}
  .module-title{font-size:18px;font-weight:800;margin:4px 4px 12px;display:flex;align-items:center;gap:8px;}
  .module-title .dot{width:8px;height:8px;border-radius:50%;background:var(--primary);}

  /* 卡片 */
  .card{background:var(--surface);border-radius:var(--radius);padding:15px 16px;box-shadow:var(--shadow);margin-bottom:12px;}
  .card.tap:active{transform:scale(.99);}
  .row{display:flex;align-items:center;gap:10px;}
  .between{justify-content:space-between;}
  .tag{display:inline-block;font-size:11px;padding:2px 9px;border-radius:999px;background:var(--primary-soft);color:var(--primary);margin:0 6px 6px 0;}
  .tag.gray{background:var(--bg);color:var(--soft);}
  .tag.src{background:#fff1e6;color:#d9742a;}
  .muted{color:var(--soft);font-size:13px;}
  .faint{color:var(--faint);font-size:12px;}

  /* 概览 */
  .hero{border-radius:var(--radius);padding:18px;color:#fff;margin-bottom:14px;
    background:linear-gradient(135deg,var(--primary),var(--accent));box-shadow:var(--shadow-lg);}
  .hero .date{font-size:12px;opacity:.9;}
  .hero .hl{font-size:22px;font-weight:900;margin:6px 0 2px;}
  .hero .sub{font-size:12px;opacity:.9;}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:6px;}
  .stat{background:var(--surface);border-radius:var(--radius-sm);padding:13px 10px;text-align:center;box-shadow:var(--shadow);}
  .stat .n{font-size:20px;font-weight:900;color:var(--primary);}
  .stat .l{font-size:11px;color:var(--faint);margin-top:2px;}
  .quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
  .quick{background:var(--surface);border-radius:var(--radius-sm);padding:14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:11px;}
  .quick .qi{width:38px;height:38px;border-radius:11px;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 auto;}
  .quick .qt{font-weight:700;font-size:14px;}
  .quick .qs{font-size:11px;color:var(--faint);}
  .quick:active{transform:scale(.98);}

  /* 英语练习 */
  .en-word{font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .en-phon{color:var(--faint);font-size:12px;margin-left:0;}
  .en-desc{margin-top:7px;color:var(--text);font-size:14px;}
  .en-eg{margin-top:7px;color:var(--soft);font-size:13px;font-style:italic;border-left:3px solid var(--primary-soft);padding-left:9px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .en-eg .spk-inline{margin-left:0;width:26px;height:26px;font-size:12px;flex:0 0 auto;}
  .en-trans{margin-top:4px;color:var(--text);font-size:13px;font-weight:600;padding-left:12px;}
  .spk{margin-left:2px;width:30px;height:30px;border-radius:50%;background:var(--primary-soft);color:var(--primary);font-size:13px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;border:none;}
  .spk:active{transform:scale(.9);}
  .ext{display:inline-block;margin-top:12px;padding:9px 14px;border-radius:11px;background:var(--primary);color:#fff;font-size:13px;font-weight:700;text-decoration:none;cursor:pointer;}
  .ext:active{opacity:.85;}

  /* 新闻 */
  .news-src{font-size:11px;font-weight:800;padding:2px 9px;border-radius:999px;}
  .news-title{font-size:15px;font-weight:700;margin-top:8px;line-height:1.45;}
  .news-sum{color:var(--soft);font-size:13px;margin-top:6px;}
  .news-meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12px;color:var(--faint);}
  .news-link{color:var(--primary);font-weight:700;}

  /* 产品二创 */
  .seg{display:flex;background:var(--surface);border-radius:12px;padding:4px;box-shadow:var(--shadow);margin-bottom:12px;}
  .seg button{flex:1;padding:9px;border-radius:9px;font-weight:700;font-size:13px;color:var(--soft);}
  .seg button.on{background:var(--primary);color:#fff;}
  .seg.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .seg.scroll button{flex:0 0 auto;white-space:nowrap;padding:9px 14px;}
  .seg.scroll::-webkit-scrollbar{display:none;}
  .prod-name{font-size:15.5px;font-weight:800;}
  .plat{font-size:10px;font-weight:800;padding:2px 7px;border-radius:6px;margin-left:8px;vertical-align:middle;}
  .plat.a1688{background:#ffefe0;color:#e8730c;}
  .plat.intl{background:#e6f0ff;color:#1f6bff;}
  .prod-img{position:relative;height:120px;border-radius:14px;margin-bottom:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;}
  .prod-emoji{font-size:48px;line-height:1;filter:drop-shadow(0 5px 10px rgba(0,0,0,.2));}
  .prod-cap{position:absolute;left:0;right:0;bottom:0;padding:9px 12px;color:#fff;font-size:13px;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.4);background:linear-gradient(transparent,rgba(0,0,0,.32));z-index:2;}
  .prod-wrap{position:relative;height:120px;border-radius:14px;margin-bottom:12px;overflow:hidden;background:#eef1f8;}
  .prod-fallback{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .prod-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;z-index:1;}
  .angle{margin-top:8px;background:var(--primary-soft);border-radius:11px;padding:10px 12px;font-size:13px;color:var(--primary-deep);}
  .angle b{color:var(--primary);}
  .heat{height:7px;border-radius:999px;background:var(--bg);margin-top:11px;overflow:hidden;}
  .heat > i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--primary),var(--accent));}

  /* 基金/股票 */
  .rank{display:flex;align-items:center;gap:12px;}
  .rank-no{width:26px;height:26px;border-radius:8px;background:var(--primary-soft);color:var(--primary);font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .rank-no.top{background:var(--primary);color:#fff;}
  .rank-name{flex:1;min-width:0;}
  .rank-name .nm{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .rank-name .cd{font-size:11px;color:var(--faint);}
  .rank-val{text-align:right;flex:0 0 auto;}
  .rank-val .in{font-weight:900;font-size:15px;color:var(--up);}
  .rank-val .ch{font-size:11px;font-weight:700;}
  .up{color:var(--up);} .down{color:var(--down);}
  .update-flag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--primary);background:var(--primary-soft);padding:3px 10px;border-radius:999px;}
  .update-flag .pulse{width:7px;height:7px;border-radius:50%;background:var(--primary);animation:pulse 1.4s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(31,79,255,.5)}70%{box-shadow:0 0 0 7px rgba(31,79,255,0)}100%{box-shadow:0 0 0 0 rgba(31,79,255,0)}}

  /* 巴芒价值投资板块 */
  .buff-quote{background:linear-gradient(135deg,#1f2a44,#2c3a63);color:#fff;border-radius:14px;padding:16px 18px;font-size:14px;line-height:1.7;font-weight:600;box-shadow:0 8px 24px rgba(20,24,58,.12);}
  .buff-tomorrow{margin-top:12px;border-radius:16px;padding:16px;color:#fff;}
  .buff-tomorrow.up{background:linear-gradient(135deg,#0fae6b,#16c97e);}
  .buff-tomorrow.down{background:linear-gradient(135deg,#e8413f,#ff5a5f);}
  .buff-tomorrow .bt-label{font-size:12px;opacity:.9;}
  .buff-tomorrow .bt-dir{font-size:30px;font-weight:900;margin:4px 0;line-height:1.1;}
  .buff-tomorrow .bt-conf{font-size:13px;font-weight:700;opacity:.95;}
  .buff-tomorrow .bt-reason{font-size:12.5px;line-height:1.6;margin-top:6px;opacity:.92;}
  .bh{font-weight:800;font-size:14.5px;margin-bottom:7px;color:var(--text);}
  .bb{font-size:13.5px;color:var(--soft);line-height:1.7;}
  .buff-act{flex:0 0 auto;font-size:11px;font-weight:800;padding:3px 10px;border-radius:999px;}
  .buff-act.buy{background:#e6f7ee;color:#0fae6b;}
  .buff-act.hold{background:#eef1f8;color:#5b6b8c;}
  .buff-act.wait{background:#fff2e6;color:#e8730c;}
  .buff-points{display:flex;gap:10px;margin-top:9px;}
  .buff-points .bp{flex:1;background:var(--bg);border-radius:11px;padding:9px 11px;}
  .buff-points .bpl{display:block;font-size:11px;color:var(--faint);margin-bottom:3px;}
  .buff-points .bp{font-size:13px;font-weight:700;color:var(--text);}

  /* 设置 */
  .field{margin-bottom:14px;}
  .field label{font-size:12px;font-weight:700;color:var(--soft);display:block;margin-bottom:6px;}
  .field input{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 13px;box-shadow:var(--shadow);}
  .btn{width:100%;padding:13px;border-radius:12px;background:var(--primary);color:#fff;font-weight:800;font-size:15px;box-shadow:var(--shadow);}
  .btn.ghost{background:var(--surface);color:var(--primary);border:1px solid var(--primary-soft);}
  .btn:active{opacity:.88;}
  .note{font-size:12px;color:var(--soft);line-height:1.7;background:var(--surface);border-radius:12px;padding:13px;border:1px dashed var(--line);}

  .empty{text-align:center;color:var(--faint);padding:50px 20px;}
  .empty .e{font-size:40px;margin-bottom:10px;}

  .toast{position:fixed;bottom:calc(28px + var(--safe-b));left:50%;transform:translateX(-50%);
    background:rgba(20,24,58,.94);color:#fff;padding:11px 20px;border-radius:999px;font-size:13px;z-index:80;box-shadow:var(--shadow-lg);max-width:84%;text-align:center;animation:tin .2s ease;}
  @keyframes tin{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}

  .refresh-spin{animation:spin 1s linear infinite;display:inline-block;}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app">
  <!-- 顶栏 -->
  <header class="topbar">
    <button id="menuBtn" aria-label="菜单">☰</button>
    <div class="topbar-title" id="topTitle">每日创作台<small id="topSub">每天 8 / 14 / 20 点自动更新</small></div>
    <button id="refreshBtn" aria-label="刷新" title="从 Gist 刷新">⟳</button>
  </header>

  <!-- 主内容 -->
  <main id="main"><!-- 视图由 JS 渲染 --></main>
</div>

<!-- 抽屉 -->
<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <div class="logo">
      <svg viewBox="0 0 64 64"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#dfe6ff"/></linearGradient></defs><rect width="64" height="64" rx="16" fill="rgba(255,255,255,.12)"/><path d="M20 42 L32 18 L44 42 Z" fill="url(#g)"/><rect x="28" y="36" width="8" height="14" rx="2" fill="#fff"/></svg>
      <div><div class="logo-name">每日创作台</div><div class="logo-sub">Gem-Blue · 本地优先</div></div>
    </div>
  </div>
  <nav class="nav" id="nav"><!-- 导航项由 JS 渲染 --></nav>
  <div class="drawer-foot">
    数据默认读取公开 Gist，本地缓存。<br>
    最后更新：<span id="footUpdated">—</span>
  </div>
</aside>

<div class="toast" id="toast" hidden></div>

<script>
/* =========================================================================
   每日创作台 — 单文件移动端应用
   数据：优先读公开 Gist（GIST_URL），失败/为空时回退到内置种子数据。
   ========================================================================= */
(function(){
  "use strict";

  /* ---- 配置：公开 Gist 地址（接通后由自动化写入，留空则用种子数据） ---- */
  var GIST_URL = "";                 // 例：https://gist.githubusercontent.com/用户名/ID/raw/data.json
  var GIST_FALLBACK = GIST_URL;      // localStorage 可覆盖

  /* ---- 真实数据覆盖层（1688 爬虫产出，优先于规则数据） ---- */
  // 同源 data.real.json：本机爬虫提交到仓库后自动生效（GitHub Pages 同源可直读）。
  // 若想用 Gist 直供真实数据，把 raw 链接填到下方或 App「设置→真实数据Gist」。
  var GIST_REAL_FALLBACK = "";       // 例：https://gist.githubusercontent.com/用户名/ID/raw/data.real.json
  var GIST_REAL_URL = GIST_REAL_FALLBACK; // localStorage "gistRealUrl" 可覆盖

  /* ---- 内置种子数据（在 Gist 未接通时让页面“有内容”） ---- */
var SEED_PRODUCT_POOL = [
  {key:"usb_hub", name:"USB HUB", tag1:"USB HUB", tag2:"电脑外设",
   arch:[
    ["多功能Type-C扩展坞","USB C Hub Multiport Adapter","做「笔记本一拖多」桌面布置，演示同时接显示器/硬盘/键鼠，强调多接口稳定不掉线。","Laptop one-to-many desk setup, show multi-port stable connection."],
    ["7口带PD供电USB HUB","Powered 7-Port USB Hub","做「桌面供电一体」演示，强调边充边传数据、接口不抢电。","Desktop power-integrated demo, charge while transfer."],
    ["Type-C扩展卡 多屏扩展","USB C Multi-Screen Adapter","打「多屏办公」痛点，演示双屏扩展，强调即插即显。","Multi-screen office pain, dual display demo, plug-and-show."],
    ["迷你Type-C扩展坞 便携","Mini USB C Hub Portable","做「出差党」场景，演示一根线扩展，强调巴掌大能塞进口袋。","Frequent traveler scene, one cable expand, pocket-size."],
    ["铝合金Type-C分线器","Aluminum USB C Splitter","打「质感桌面」痛点，演示金属外壳散热好，强调不掉速。","Premium metal build, better heat dissipation, no speed drop."],
    ["千兆网口Type-C扩展坞","USB C Hub with Ethernet","做「笔记本没网口」痛点，演示接有线网稳如老狗。","Old laptop no ethernet port pain, stable wired net."],
    ["十合一Type-C扩展坞","10-in-1 USB C Docking Station","打「全能坞」卖点，演示一个坞接全外设，强调桌面极简。","All-in-one dock, connect all peripherals, minimal desk."],
    ["带HDMI的Type-C扩展坞","USB C Hub with HDMI","做「投屏办公」演示，强调4K清晰+便携即插即用。","Screen-mirror office demo, 4K clear + portable."],
    ["USB3.0四口集线器","USB 3.0 4-Port Hub","打「老笔记本接口少」痛点，演示四口同时传不降速。","Old laptop few ports pain, 4 ports no speed drop."],
    ["立式多口USB HUB","Vertical Multi-Port USB Hub","做「桌搭美学」场景，演示立式省空间不缠线。","Desk aesthetic scene, vertical saves space, no tangling."]
   ]},
  {key:"conv_switch", name:"转换器 & 切换器", tag1:"转换器", tag2:"办公",
   arch:[

      var started=false;
      u.onstart=function(){ started=true; };
      u.onerror=function(){ if(!started) toast("发音失败：请检查手机是否静音，或系统「文字转语音(TTS)」未安装英文语音包"); };
      if(ss.speaking||ss.pending){
        // 正在播放：先取消，稍后再播（避免 Android 同步 cancel 吞掉发音）
        try{ ss.cancel(); }catch(e){}
        setTimeout(function(){ try{ ss.speak(u); }catch(e){} }, 80);
      }else{
        // 首次/空闲：必须在用户点击调用栈内“同步” speak，才能解锁 Android 音频
        try{ ss.speak(u); }catch(e){ toast("发音失败，请检查手机是否静音"); }
        // iOS 偶发首次静音：若 onstart 未触发且 300ms 仍空闲，则补一次（不会重复短词）
        setTimeout(function(){ if(!started && !ss.speaking && !ss.pending){ try{ ss.speak(u); }catch(e){} } }, 300);
      }
    }catch(e){ toast("发音失败，请检查手机是否静音或未装英文语音包"); }
  }

        '<div class="bb" style="margin-top:8px"><b>走势：</b>'+esc(it.trend||"")+'</div>'+
        '<div class="buff-points"><div class="bp"><span class="bpl">买点</span>'+esc(it.buy||"—")+'</div>'+
          '<div class="bp"><span class="bpl">卖点</span>'+esc(it.sell||"—")+'</div></div>'+
        '<div class="bb"><b>逻辑：</b>'+esc(it.logic||"")+'</div>'+
        '<a class="ext" data-url="'+esc(pickLink(it))+'">查 '+esc(it.name)+' 行情 ↗</a>'+
      '</div>';
    });
    return html+'</div>';
  }

  /* ---- 视图内事件 ---- */
  function bindView(){
    $all("[data-go]").forEach(function(b){b.addEventListener("click",function(){go(b.dataset.go);});});
    $all("[data-track]").forEach(function(b){b.addEventListener("click",function(){trackTab=parseInt(b.dataset.track,10)||0;render();});});
    $all("[data-spk]").forEach(function(b){b.addEventListener("click",function(e){e.stopPropagation();speak(b.dataset.spk);});});
    $all("[data-url]").forEach(function(b){b.addEventListener("click",function(e){e.preventDefault();e.stopPropagation();openExt(b.dataset.url);});});
  }
  function $all(s){return Array.prototype.slice.call(document.querySelectorAll(s));}

  /* ============================ 数据加载 ============================ */
  function getGistUrl(){
    try{var u=localStorage.getItem("gistUrl");if(u)return u;}catch(e){}
    if(GIST_FALLBACK||GIST_URL) return GIST_FALLBACK||GIST_URL;
    return "./data.json";   // 无 Gist 时回退到同源 data.json
  }
  function getRealOverlaySources(){
    // 真实数据覆盖层的多个来源，按优先级：Gist 真实链接 > 同源 data.real.json
    var arr=["./data.real.json"];   // 同源覆盖层（本机爬虫提交到仓库即生效）
    try{var u=localStorage.getItem("gistRealUrl");if(u)arr.unshift(u.trim());}catch(e){}
    if(GIST_REAL_URL) arr.unshift(GIST_REAL_URL);
    return arr;
  }
  function mergeRealOverlay(real){
    // 用真实覆盖层替换对应平台的规则数据（仅当该平台确有真实 tracks）
    if(!real||!real.live) return false;
    var changed=false;
    if(real.p1688&&real.p1688.tracks&&real.p1688.tracks.length){
      DATA.p1688=real.p1688; DATA.live1688=true; changed=true;
    }
    if(real.pintl&&real.pintl.tracks&&real.pintl.tracks.length){
      DATA.pintl=real.pintl; DATA.liveIntl=true; changed=true;
    }
    DATA.live = !!(DATA.live1688||DATA.liveIntl);
    DATA.realUpdatedAt = real.updatedAt || DATA.realUpdatedAt;
    DATA.realSource = real.source || "real";
    return changed;
  }
  function applyRealOverlay(){
    // 依次尝试各覆盖层来源，取最新的真实数据
    var sources=getRealOverlaySources();
    var best=null;
    function tryNext(i){
      if(i>=sources.length){
        if(best){
          mergeRealOverlay(best);
          try{localStorage.setItem("wbReal",JSON.stringify(best));}catch(e){}
        }
        DATA._realApplied = !!best;
        render();
        return;
      }
      fetch(sources[i]+"?t="+Date.now(),{cache:"no-store"})
        .then(function(r){ if(!r.ok) throw new Error("http "+r.status); return r.json(); })
        .then(function(j){
          if(j&&j.live&&j.p1688&&j.p1688.tracks&&j.p1688.tracks.length){
            if(!best || (j.updatedAt||0) >= (best.updatedAt||0)) best=j;
          }
        })
        .catch(function(e){ /* 无覆盖层属正常，静默 */ })
        .finally(function(){ tryNext(i+1); });
    }
    tryNext(0);
  }
  function loadData(force){
    var url=getGistUrl();
    if(!url){ if(force) toast("未配置数据源，显示内置样例"); return; }
    $("#refreshBtn").innerHTML='<span class="refresh-spin">⟳</span>';
    fetch(url+"?t="+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("http "+r.status);return r.json();})
      .then(function(json){
        if(json&&(json.english||json.news||json.p1688||json.pintl||json.funds||json.stocks)){
          DATA=json; DATA.updatedAt=DATA.updatedAt||Date.now();
          // 先试用缓存里的真实标记（断网时仍显示真实状态）
          try{var c=localStorage.getItem("wbReal");if(c){var rj=JSON.parse(c); if(rj.live) mergeRealOverlay(rj);}}catch(e){}
          try{localStorage.setItem("wbCache",JSON.stringify(DATA));}catch(e){}
          render(); if(force) toast("已刷新最新数据 ✅");
        } else { if(force) toast("数据源为空，显示样例"); }
      })
      .catch(function(err){ console.warn("数据读取失败",err); if(force) toast("读取失败，显示内置样例"); })
      .finally(function(){
        $("#refreshBtn").innerHTML="⟳";
        // 无论基础数据是否成功，都尝试套用真实覆盖层
        applyRealOverlay();
      });
  }
  function loadCache(){
    try{var c=localStorage.getItem("wbCache");if(c){DATA=JSON.parse(c);}}catch(e){}
  }

  /* ============================ 导航 / 抽屉 ============================ */
  function go(id){ if(!TITLES[id])return; current=id; renderNav(); render(); window.scrollTo(0,0); }
  function openDrawer(){ $("#drawer").classList.add("open"); $("#overlay").classList.add("show"); }
  function closeDrawer(){ $("#drawer").classList.remove("open"); $("#overlay").classList.remove("show"); }

  /* ============================ 启动 ============================ */
  function bind(){
    $("#menuBtn").addEventListener("click",openDrawer);
    $("#overlay").addEventListener("click",closeDrawer);
    $("#refreshBtn").addEventListener("click",function(){loadData(true);});
  }
  bind();
  loadCache();
  renderNav();
  render();
  // 进入即尝试拉一次最新（无 Gist 时静默回退种子）
  loadData(false);
})();
</script>
</body>
</html>
