name: 每日创作台数据更新

on:
  schedule:
    # 北京时间 8 / 14 / 20 点 = UTC 0 / 6 / 12 点
    - cron: '0 0,6,12 * * *'
  workflow_dispatch: {}   # 允许在 Actions 页面手动触发

permissions:
  contents: write        # 用自带 GITHUB_TOKEN 把 data.json 提交回仓库（无需自定义 Token/Secret）

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 生成数据（规则版，无需 AI）
        env:
          NICHE_KEYWORDS: ${{ vars.NICHE_KEYWORDS || '电脑3C产品,外贸热点' }}
          PUBLIC_ACCOUNT: ${{ vars.PUBLIC_ACCOUNT || '环球时报GlobalTimes' }}
        run: python generate.py

      - name: 提交 data.json 回仓库
        run: |
          git config user.email "bot@github.com"
          git config user.name "daily-creator"
          git add data.json
          git commit -m "每日更新 $(date +'%Y-%m-%d %H:%M')" || echo "无变化"
          git push https://${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
